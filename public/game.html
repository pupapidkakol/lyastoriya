<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <title>Гра — ЛяСторія</title>
</head>

<body>
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo"><span class="logo__bars"><i></i><i></i><i></i></span>ЛяСторія</a>
      <nav class="nav" aria-label="Головна навігація"><a href="index.html#games">Ігри</a><a
          href="index.html#theory">Теорія</a><a href="index.html#results">Результати</a></nav>
      <div class="header__actions" id="authActions">
        <a href="auth.html#login" class="btn btn--ghost">Увійти</a>
        <a href="auth.html#register" class="btn btn--accent">Зареєструватися</a>
      </div>
    </div>
  </header>
  <!-- Шаблон гри: game.html?g=<id>. Додати нову гру = додати файл js/games/<id>.js і запис у js/game-page.js -->
  <main id="gamePage">
    <div class="container game-head">
      <a href="index.html#games" class="back">← Усі ігри</a>
      <p class="label" id="gameLabel"></p>
      <h1 id="gameTitle">Гра</h1>
    </div>
    <section class="game-band">
      <div class="container game-layout">
        <aside class="game-aside">
          <p class="label">Твій виклик</p>
          <h2 id="asideTitle"></h2>
          <p id="asideText"></p>
          <p class="label label--foot" id="asideFoot"></p>
        </aside>
        <div id="gameRoot" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer class="container footer">
    <div class="footer__top">
      <div class="footer__brand">
        <a href="index.html" class="logo">ЛяСторія</a>
        <span>Минуле ближче, ніж здається.</span>
      </div>
      <span class="label" style="margin:0">Історія України / Грай і відкривай</span>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/game-page.js"></script>
</body>

</html>
